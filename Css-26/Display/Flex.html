<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
<style>
    div p{
        background-color: aqua;
        width: 100px;
        height: 100px;
        align-content: center;
        text-align: center;
       
    }

    div{
        display: flex;
        gap: 2px;
        flex-direction: row;
flex-wrap: nowrap;
        height: 600px;
        /* width: 1150px; */
        justify-content:center;
        /* row  and row-reverse=> justify-content=> left to right */
        /* col and col-reverse=>  justify-content=> top to bottom:  */
        align-items: center;
        /* row and row-reverse=> align-items=>top to bottom ; */
         /* col and col-reverse=> align-items=> left to right */
        border:2px solid black;
    }
    *{
        margin: 0px;
    }
    .box1{
      order: 1;
      flex-grow: 1;
      flex-shrink: 1;
    
    }
     .box2{
        order:2;
         flex-grow: 1;
         flex-shrink: 1;
    }
     .box3{
        order:7;
         flex-grow: 1;
         flex-shrink: 1;
    }
     .box4{
        
        order: 4;
         flex-grow: 1;
         flex-shrink: 1;
    }
     .box5{
        order:9;
         flex-grow: 1;
         flex-shrink: 1;
    }
     .box6{
        order:6;
        flex-basis: 100px;
         flex-grow: 1;
         flex-shrink: 1;
    }
     .box7{
        order:3;
         flex-grow: 1;
         flex-shrink: 3;
    }
     .box8{
        order:8;
         flex-grow: 1;
         flex-shrink: 1;
        
    }
    .box9{
order:5;
 flex-grow: 1;
 flex-shrink: 2;
    }
    .box10{
order:10;
 flex-grow: 1;
 flex-shrink: 1;
    }
</style>
</head>
<body>
    <div>
        <p class="box1">1</p>
        <p class="box2">2</p>
        <p class="box3">3</p>
        <p class="box4">4</p>
        <p class="box5">5</p>
        <p class="box6">6</p>
        <p class="box7">7</p>
        <p class="box8">8</p>
        <p class="box9">9</p>
        <p class="box10">10</p>
    </div>
</body>
</html>
