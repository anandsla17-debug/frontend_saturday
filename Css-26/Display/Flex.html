<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
<style>
    div p{
        background-color: aqua;
        width: 100px;
        height: 100px;
        align-content: center;
        text-align: center;
       
    }

    div{
        display: flex;
        gap: 2px;
        flex-direction: row;

        border:2px solid black;
    }
    *{
        margin: 0px;
    }
</style>
</head>
<body>
    <div>
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>5</p>
        <p>6</p>
        <p>7</p>
        <p>8</p>
        <p>9</p>
        <p>10</p>
    </div>
</body>
</html>
