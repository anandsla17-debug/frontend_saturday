<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transaction</title>
    <style>
p{
    width: 100%;
    height: 100px;
    background-color: aquamarine;
    text-align: center;
    align-content: center;
    transition-duration: 5s;
    transition-delay: 1s;
    transition-timing-function: cubic-bezier(1,-0.18, 0.75, 0.72);
    transition-property: width;
}
p:hover{
    width: 100px;
    background-color: blue;
}
h1{
    width: 200px;
    height: 200px;
    background-color: rgb(96, 96, 139);
    transition-duration: 1s;
}
h1:hover{
    box-shadow: 1px 1px 10px 1px yellow;

}
    </style>
</head>
<body>
    <p>box</p>
    <h1>product</h1>
</body>
</html>
