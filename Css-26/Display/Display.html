<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .hello{
            display: none;
        }
        .in{
            display: inline-block;
            background-color: blueviolet;
            height: 200px;
            width: 300px;
            margin-left: 20px;
            margin-right: 20px;
            margin-top: 100px;
            margin-bottom: 30px;
        }
        div .bl{
            display: block;
        }

    </style>
</head>
<body>
    <h1>none</h1>
    <p class="hello">hello word</p>

    <div style="width: 900px; border: 2px solid black;">
    <h1 class="in">welcome Students,</h1>
    <h2 class="in">good morning student</h2>
    </div>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nesciunt itaque, hic commodi iste dignissimos obcaecati corrupti optio quis repellat in sequi, iure qui? Voluptas, sequi placeat officia nihil amet sed.</p>
    <div>
        <s class="bl">s1</s>
        <u class="bl">s2</u>
        <em class="bl">s3</em>
        <b class="bl">s4</b>
        <abbr class="bl">s5</abbr>
    <span class="bl">s6</span>
    </div>

</body>
</html>
