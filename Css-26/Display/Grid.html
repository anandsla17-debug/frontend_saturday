<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid system</title>
    <style>
        p{
        
            background-color: blueviolet;
            text-align: center;
            align-content: center;
            
        }
        .grid{
            display: grid;
            width: 600px;
            height: 500px;
            border: 2px solid black;
            

            grid-template-columns:repeat(3,100px) ;
            grid-template-rows: 20px 50px 70px 100px ;
            column-gap: 3px;
            row-gap: 3px;
            justify-content: center;  
            /* left to right */
            align-content: center ;
            /* top to bottom */
            /* justify-items: center; */
            /* align-items: center; */

           

    

        }

        *{
            margin: 0px;
        }

        .box10{
            grid-column: 3 span;
        }
        .box1{
            grid-row:2 span;
        }
        .box7{
grid-row: 2 span;
        }
        .box8{
grid-row:2 span;
        }

        .grid-flow{
            display: grid;
            width: 600px;
            height: 500px;
            border: 2px solid black;
            grid-auto-flow: column;
            grid-template-columns: repeat(auto-fit,minmax(50px,1fr));
            
        }
      .grid-flow  p{
            background-color: beige;
           
        }

        
    </style>
</head>
<body>
    <div class="grid">
    <p class="box1">1</p>
    <p class="box2">2</p>
    <p class="box3">3</p>
    <p class="box4">4</p>
    <p class="box5">5</p>
    <p class="box6">6</p>
    <p class="box7">7</p>
    <p class="box8">8</p>
    <p class="box9">9</p>
    <p class="box10">10</p>
    </div>
    

     <div class="grid-flow">
    <p class="box11">1</p>
    <p class="box22">2</p>
    <p class="box33">3</p>
    <p class="box44">4</p>
    <p class="box55">5</p>
    <p class="box66">6</p>
    <p class="box77">7</p>
    <p class="box88">8</p>
    <p class="box99">9</p>
    <p class="box100">10</p>
    </div>


    
</body>
</html>
