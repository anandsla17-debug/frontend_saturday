<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <style>
        .form-bg{
            background-color: beige;
        }
     </style>
</head>
<body>
    <p class="bg-primary text-white display-6 opacity-100">Bootstrap intro</p>
    <p class="bg-warning text-success mx-2 my-5 border border-5 border-primary rounded-5 text-center fs-5 p-5 text-capitalize fw-bold " >Box=>margin,border,padding,content</p>

    <p>.........</p>
    <form class="container border border-2 form-bg   border-success rounded p-3 mb-4 w-50"  >
        <p class="h4 text-center ">User Registation</p>
        <label class="form-label">user name</label>
        <input class="form-control" type="text" placeholder="Enter your username">
        <label class="form-label">user id</label>
        <input class="form-control" type="text" placeholder="Enter your user id">
        <label class="form-label">user password</label>
        <input class="form-control" type="password" placeholder="Enter your password">
        <span class="d-flex justify-content-center">
        <button class="btn btn-success w-100 mt-2">Register</button>
        </span>
        <p class="text-capitalize text-center mt-2">do you have an Account?<a class="btn btn-warning">Sign in</a></p>
    </form>


</body>
</html>
